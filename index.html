<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Palette Grid</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-lime: #CCFF02;
      --color-storm: #8696A8;
      --color-violet: #E4D2FC;
      --color-chilli: #EF432B;
      --color-dark: #282625;
      --color-light: #EFEAE8;
      --color-forest: #325444;

      --font-display: "Syne", "Arial Black", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
    }

    .palette {
      display: grid;
      grid-template-columns: 1fr 1fr 0.68fr;
      grid-template-rows: repeat(8, 1fr);
      grid-template-areas:
        "lime   dark  forest"
        "lime   dark  forest"
        "storm  dark  forest"
        "storm  light forest"
        "violet light forest"
        "violet light forest"
        "chilli light forest"
        "chilli light forest";
      gap: 0;
      width: 100%;
      min-height: 100vh;
    }

    .tile {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(0.75rem, 1.4vw, 2rem);
      overflow: hidden;
    }

    .tile__hex {
      font-family: var(--font-display);
      font-size: clamp(0.7rem, 1.1vw, 1.2rem);
      letter-spacing: 0.04em;
    }

    .tile__title {
      font-size: clamp(2.5rem, 9.5vw, 11rem);
      line-height: 0.9;
      letter-spacing: -0.02em;
    }

    .tile--lime {
      grid-area: lime;
      background: var(--color-lime);
      color: var(--color-forest);
      justify-content: flex-start;
      gap: 0.5rem;
    }

    .tile--storm {
      grid-area: storm;
      background: var(--color-storm);
      color: var(--color-light);
      justify-content: flex-start;
      gap: 0.5rem;
    }

    .tile--violet {
      grid-area: violet;
      background: var(--color-violet);
      color: var(--color-chilli);
      justify-content: flex-start;
      gap: 0.5rem;
    }

    .tile--chilli {
      grid-area: chilli;
      background: var(--color-chilli);
      color: var(--color-light);
      justify-content: flex-start;
      gap: 0.5rem;
    }

    .tile--dark {
      grid-area: dark;
      background: var(--color-dark);
      color: var(--color-light);
      justify-content: flex-start;
      gap: 0.5rem;
    }

    .tile--dark .tile__title {
      font-size: clamp(3rem, 12vw, 14rem);
    }

    .tile--light {
      grid-area: light;
      background: var(--color-light);
      color: var(--color-dark);
    }

    .tile--light .tile__title {
      font-size: clamp(2.5rem, 8vw, 9.5rem);
    }

    .tile--forest {
      grid-area: forest;
      background: var(--color-forest);
      color: var(--color-light);
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
    }

    .tile--forest .tile__title {
      writing-mode: vertical-rl;
      font-size: clamp(3rem, 11vw, 13rem);
      line-height: 1;
      align-self: stretch;
    }

    @media (max-width: 700px) {
      .palette {
        grid-template-columns: 1fr;
        grid-template-rows: none;
        grid-template-areas:
          "lime"
          "dark"
          "storm"
          "light"
          "violet"
          "forest"
          "chilli";
      }

      .tile {
        min-height: 40vw;
      }

      .tile--forest .tile__title {
        writing-mode: horizontal-tb;
      }
    }
  </style>
</head>

<body>

  <main class="palette">

    <section class="tile tile--lime">
      <span class="tile__hex">#CCFF02</span>
      <h2 class="tile__title">Lime</h2>
    </section>

    <section class="tile tile--dark">
      <span class="tile__hex">#282625</span>
      <h2 class="tile__title">Dark</h2>
    </section>

    <section class="tile tile--forest">
      <span class="tile__hex">#325444</span>
      <h2 class="tile__title">Forest</h2>
    </section>

    
    <section class="tile tile--storm">
      <span class="tile__hex">#8696A8</span>
      <h2 class="tile__title">Storm</h2>
    </section>

    <section class="tile tile--light">
      <span class="tile__hex">#EFEAE8</span>
      <h2 class="tile__title">Light&amp;<br>Bright</h2>
    </section>

    <section class="tile tile--violet">
      <span class="tile__hex">#E4D2FC</span>
      <h2 class="tile__title">Violet</h2>
    </section>

    <section class="tile tile--chilli">
      <span class="tile__hex">#EF432B</span>
      <h2 class="tile__title">Chilli</h2>
    </section>

  </main>

</body>
</html>
